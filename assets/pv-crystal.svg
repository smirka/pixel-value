<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
<title id="title">Абстрактный стеклянный кристалл</title>
<desc id="desc">Геометрический кристалл из полупрозрачных фиолетовых, бирюзовых и зелёных граней.</desc>
<defs>
 <linearGradient id="glass" x1="18%" y1="5%" x2="88%" y2="100%"><stop stop-color="#c3adff" stop-opacity=".92"/><stop offset=".48" stop-color="#66dfc4" stop-opacity=".72"/><stop offset="1" stop-color="#00ff9c" stop-opacity=".68"/></linearGradient>
 <linearGradient id="left" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".72"/><stop offset="1" stop-color="#9b7bff" stop-opacity=".14"/></linearGradient>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PIXEL / VALUE — загрузка…</title>
<style>
html,body{margin:0;height:100%;background:#090a10;color:#e8e8f0;font-family:system-ui,sans-serif}
.box{display:grid;place-items:center;height:100%;text-align:center;gap:12px}
.sp{width:28px;height:28px;border:2px solid #9b7bff;border-top-color:transparent;border-radius:50%;animation:s .8s linear infinite;margin:0 auto}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="sp"></div><div>Загрузка презентации…</div></div>
<script>
(async function(){
  try {
    var n = 10;
    var parts = [];
    for (var i = 1; i <= n; i++) {
      var r = await fetch('part' + i + '.txt', {cache:'no-store'});
      if (!r.ok) throw new Error('part ' + i + ' ' + r.status);
      parts.push(await r.text());
    }
    var html = parts.join('');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<div class="box"><div>Не удалось загрузить. Обновите страницу.</div><pre style="opacity:.5;font-size:12px">'+String(e)+'</pre></div>';
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PIXEL / VALUE</title>
<meta name="description" content="Интерактивное исследование: за что игроки платят в играх"/>
<style>
html,body{margin:0;height:100%;background:#090a10;color:#e8e8f0;font-family:system-ui,sans-serif}
.box{display:grid;place-items:center;height:100%;text-align:center;gap:12px}
.sp{width:28px;height:28px;border:2px solid #9b7bff;border-top-color:transparent;border-radius:50%;animation:s .8s linear infinite;margin:0 auto}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="sp"></div><div>Загрузка презентации…</div></div>
<script>
(async function(){
  try {
    var urls = [
      'https://cdn.jsdelivr.net/gh/smirka/pixel-value@5b1f7692daade130eae4307c51366aaf2768f8f3/index.html',
      'https://raw.githubusercontent.com/smirka/pixel-value/5b1f7692daade130eae4307c51366aaf2768f8f3/index.html'
    ];
    var html = null, lastErr = null;
    for (var i = 0; i < urls.length; i++) {
      try {
        var r = await fetch(urls[i], {cache:'no-store'});
        if (!r.ok) throw new Error(urls[i] + ' ' + r.status);
        html = await r.text();
        if (html.indexOf('<!DOCTYPE') === -1 && html.indexOf('<html') === -1) throw new Error('not html');
        break;
      } catch (e) { lastErr = e; }
    }
    if (!html) throw lastErr || new Error('fetch failed');

    var css = ".card.rv,.sdt.rv,.kpi.rv,.vc.rv,.eth.rv,.lim.rv,.tlstep.rv,.mini.rv,.src.rv,.co.rv{transition:opacity .62s var(--eo),transform .62s var(--eo),border-color .35s,box-shadow .5s,clip-path .85s var(--eo);transition-delay:var(--d,0ms),var(--d,0ms),0s,0s,var(--d,0ms)}.card,.sdt,.kpi,.tlstep,.vc,.eth{box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 12px 28px rgba(0,0,0,.42),0 28px 56px rgba(0,0,0,.28)!important;transform-style:preserve-3d}.card:hover,.sdt:hover,.kpi:hover,.tlstep:hover{box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 18px 36px rgba(0,0,0,.5),0 36px 64px rgba(0,0,0,.32)!important}.sdt-icon{width:52px;height:52px;margin-bottom:12px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 24px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.18) inset;transition:transform .35s ease}.sdt:hover .sdt-icon{transform:translateY(-3px) scale(1.04)}.hero-plate{width:min(58cqw,520px);aspect-ratio:16/9;margin:0 auto 18px;border-radius:22px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.14);background:radial-gradient(80% 80% at 70% 30%,rgba(0,255,156,.12),transparent 50%),radial-gradient(70% 70% at 25% 70%,rgba(155,123,255,.18),transparent 55%),linear-gradient(145deg,#12151f,#070910);box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 28px 54px rgba(0,0,0,.5);opacity:0;animation:fu .9s ease .35s forwards}.hero-plate svg{width:100%;height:100%;display:block}@media(max-width:700px){.hero-plate{width:100%}}";

    var js = "(function(){function replayMotion(sec){if(!sec||(window.Env&&Env.RM))return;sec.querySelectorAll('.h-pre,.h-sub,.h-q,.h-btns,.h-meta,.h-t b,.hero-plate').forEach(function(el){el.style.animation='none';void el.offsetWidth;el.style.animation='';});}var _play=window.play;if(typeof _play==='function'){window.play=function(sec){try{replayMotion(sec);}catch(e){}return _play.apply(this,arguments);}}})();";

    var hero = '<figure class="hero-plate" aria-hidden="true"><svg viewBox="0 0 520 292" fill="none"><defs><linearGradient id="hpG" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b7bff"/><stop offset="1" stop-color="#00ff9c"/></linearGradient><radialGradient id="hpR" cx=".5" cy=".4" r=".6"><stop stop-color="#9b7bff" stop-opacity=".35"/><stop offset="1" stop-color="transparent"/></radialGradient></defs><rect width="520" height="292" fill="#0a0c12"/><ellipse cx="360" cy="120" rx="140" ry="90" fill="url(#hpR)"/><circle cx="190" cy="110" r="42" stroke="url(#hpG)" stroke-width="2.2" fill="rgba(255,255,255,.03)"/><path d="M130 230c8-48 28-72 60-72s52 24 60 72" stroke="url(#hpG)" stroke-width="2.2" fill="rgba(155,123,255,.06)"/><path d="M360 70l12 34h36l-29 22 11 34-30-21-30 21 11-34-29-22h36z" fill="rgba(255,191,105,.15)" stroke="#ffbf69" stroke-width="1.6"/><circle cx="320" cy="210" r="14" stroke="#66dfc4" stroke-width="1.8"/><circle cx="355" cy="210" r="14" stroke="#66dfc4" stroke-width="1.8"/><circle cx="338" cy="238" r="14" stroke="#66dfc4" stroke-width="1.8"/><text x="28" y="268" fill="rgba(255,255,255,.35)" font-family="ui-monospace,monospace" font-size="11" letter-spacing="3">STYLE · STATUS · BELONGING</text></svg></figure>';

    if (html.indexOf('</head>') !== -1) {
      html = html.replace('</head>', '<style id="pv-polish">'+css+'</style></head>');
    }
    if (html.indexOf('hero-plate') === -1 && html.indexOf('class="h-meta"') !== -1) {
      html = html.replace('<div class="h-meta">', hero + '\n   <div class="h-meta">');
    }
    if (html.indexOf('</body>') !== -1) {
      html = html.replace('</body>', '<script id="pv-fix">'+js+'<\\/script></body>');
    }

    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<div class="box"><div>Не удалось загрузить презентацию.</div><pre style="opacity:.5;max-width:90%;overflow:auto;font-size:12px">'+String(e)+'</pre></div>';
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>PIXEL / VALUE</title>
<meta name="description" content="Интерактивное исследование: за что игроки платят в играх"/>
<style>
html,body{margin:0;height:100%;background:#07080e;color:#e8e8f0;font-family:system-ui,sans-serif}
.box{display:grid;place-items:center;height:100%;text-align:center;gap:12px}
.sp{width:28px;height:28px;border:2px solid #9b7bff;border-top-color:transparent;border-radius:50%;animation:s .8s linear infinite;margin:0 auto}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="sp"></div><div>Загрузка презентации…</div></div>
<script>
(async function(){
  try {
    var baseUrls = [
      'https://cdn.jsdelivr.net/gh/smirka/pixel-value@5b1f7692daade130eae4307c51366aaf2768f8f3/index.html',
      'https://raw.githubusercontent.com/smirka/pixel-value/5b1f7692daade130eae4307c51366aaf2768f8f3/index.html'
    ];
    var html=null, lastErr=null;
    for (var i=0;i<baseUrls.length;i++){
      try{
        var r=await fetch(baseUrls[i],{cache:'no-store'});
        if(!r.ok) throw new Error(baseUrls[i]+' '+r.status);
        html=await r.text();
        if(html.indexOf('<html')===-1) throw new Error('not html');
        break;
      }catch(e){lastErr=e}
    }
    if(!html) throw lastErr||new Error('fetch failed');

    var v = '22';
    html = html.replace('</head>',
      '<link rel="stylesheet" href="polish.css?v='+v+'"/>\n'+
      '<link rel="stylesheet" href="polish-beauty.css?v='+v+'"/>\n'+
      '<link rel="stylesheet" href="polish-v19.css?v='+v+'"/>\n'+
      '<link rel="stylesheet" href="polish-v20-fix.css?v='+v+'"/>\n'+
      '<link rel="stylesheet" href="polish-v21.css?v='+v+'"/>\n'+
      '<link rel="stylesheet" href="polish-v22.css?v='+v+'"/>\n</head>');
    html = html.replace('</body>',
      '<script src="polish.js?v='+v+'"></scr'+'ipt>\n'+
      '<script src="polish-upgrades.js?v='+v+'"></scr'+'ipt>\n'+
      '<script src="polish-v18.js?v='+v+'"></scr'+'ipt>\n'+
      '<script src="polish-v19.js?v='+v+'"></scr'+'ipt>\n</body>');

    document.open(); document.write(html); document.close();
  } catch(e) {
    document.body.innerHTML = '<div class="box"><div>Не удалось загрузить.</div><pre style="opacity:.5;font-size:12px">'+String(e)+'</pre></div>';
  }
})();
</script>
</body>
</html>
